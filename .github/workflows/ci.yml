name: foundation

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # persistence and object-storage carry sqlalchemy/alembic/psycopg and
        # boto3, which src/ imports directly. Without them the environment
        # cannot type-check or even import the persistence layer, so `mypy`
        # fails on unresolvable imports and test collection breaks.
        run: python -m pip install -e ".[persistence,object-storage,dev,test,security,build]"
      - name: Syntax compile
        run: python -m compileall -q src tests tools migrations migrations_market_access integrations/ibkr/src
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Isolated market journal database
        shell: pwsh
        run: |
          $taskPgData = Join-Path $env:RUNNER_TEMP 'empirical-ibkr-test-pg'
          if (Test-Path -LiteralPath $taskPgData) { throw 'Refusing to reuse an existing cluster' }
          & "$env:PGBIN\initdb.exe" -D $taskPgData -U postgres -A trust --no-locale -E UTF8
          if ($LASTEXITCODE -ne 0) { throw 'Test cluster initialization failed' }
          & "$env:PGBIN\pg_ctl.exe" -D $taskPgData -l "$taskPgData.log" -o '-h 127.0.0.1 -p 55437' -w start
          if ($LASTEXITCODE -ne 0) { throw 'Test cluster startup failed' }
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -p 55437 -U postgres empirical_ibkr_test
          if ($LASTEXITCODE -ne 0) { throw 'Test database creation failed' }
          & "$env:PGBIN\psql.exe" -h 127.0.0.1 -p 55437 -U postgres -d empirical_ibkr_test -c "COMMENT ON DATABASE empirical_ibkr_test IS 'EMPIRICAL:TEST'"
          if ($LASTEXITCODE -ne 0) { throw 'Test identity creation failed' }
      - name: Tests
        env:
          EMPIRICAL_PLATFORM_DATABASE_MODE: TEST
          EMPIRICAL_IBKR_TEST_URL: postgresql+psycopg://postgres@127.0.0.1:55437/empirical_ibkr_test
        run: python -m pytest
      - name: Architecture boundaries
        run: python tools/check_architecture.py .
      - name: Negative architecture fixture
        shell: pwsh
        run: |
          python tools/check_architecture.py tests/fixtures/illegal_imports
          if ($LASTEXITCODE -eq 0) {
            throw "Negative architecture fixture did not report a violation."
          }
          # The fixture is SUPPOSED to exit non-zero. GitHub's pwsh wrapper
          # appends `exit $LASTEXITCODE`, so without this the step inherits the
          # checker's expected failure and reports the gate as broken. Reaching
          # this line means the negative fixture behaved exactly as required.
          exit 0
      - name: Dependency audit
        run: python -m pip_audit
      - name: Secret scan
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\security.ps1
      - name: Build
        run: python -m build
      - name: Stop isolated test cluster
        if: always()
        shell: pwsh
        run: |
          $taskPgData = Join-Path $env:RUNNER_TEMP 'empirical-ibkr-test-pg'
          if (Test-Path -LiteralPath (Join-Path $taskPgData 'postmaster.pid')) {
            & "$env:PGBIN\pg_ctl.exe" -D $taskPgData -m fast -w stop
          }
