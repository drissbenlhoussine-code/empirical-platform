name: foundation

# COST REVIEW 2026-10-25. Every push and every pull request ran the full Windows verification, so a push to a
# branch with an open pull request ran it twice on the same commit. Now:
#   * a push runs it only when no open, same-repository, MERGEABLE pull request has this exact commit as its
#     head (GitHub runs no pull_request workflow for a conflicting one); master always runs; if the question
#     cannot be answered, or the routing job fails, it runs (fail closed);
#   * a newer commit on the same branch or pull request cancels the run still going for the older one
#     (never on master);
#   * the job has a timeout, and pip downloads are cached.
# Every verification step below is unchanged. Deployment and trading workflows are not touched.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  route:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verify: ${{ steps.decide.outputs.verify }}
    steps:
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify=true
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            for attempt in 1 2 3 4; do
              if covered=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open \
                  --json headRefOid,isCrossRepository,mergeable \
                  --jq "[.[] | select(.headRefOid == \"$GITHUB_SHA\" and .isCrossRepository == false)] | if length == 0 then \"none\" elif any(.mergeable == \"MERGEABLE\") then \"mergeable\" elif any(.mergeable == \"UNKNOWN\") then \"unknown\" else \"conflicting\" end"); then
                echo "attempt $attempt: open pull request for this commit: $covered"
                if [ "$covered" = "mergeable" ]; then verify=false; break; fi
                if [ "$covered" != "unknown" ]; then break; fi
              else
                echo "::warning::could not list pull requests; running the verification"
                break
              fi
              sleep 5
            done
          fi
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "push to $GITHUB_REF_NAME: verify=$verify"

  verify:
    needs: route
    # Fail closed: a push skips verification only when route SUCCEEDED and answered false.
    if: >-
      !cancelled() && (
        github.event_name == 'pull_request' ||
        !(needs.route.result == 'success' && needs.route.outputs.verify == 'false')
      )
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # persistence and object-storage carry sqlalchemy/alembic/psycopg and
        # boto3, which src/ imports directly. Without them the environment
        # cannot type-check or even import the persistence layer, so `mypy`
        # fails on unresolvable imports and test collection breaks.
        run: python -m pip install -e ".[persistence,object-storage,dev,test,security,build]"
      - name: Syntax compile
        run: python -m compileall -q src tests tools migrations
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Architecture boundaries
        run: python tools/check_architecture.py .
      - name: Negative architecture fixture
        shell: pwsh
        run: |
          python tools/check_architecture.py tests/fixtures/illegal_imports
          if ($LASTEXITCODE -eq 0) {
            throw "Negative architecture fixture did not report a violation."
          }
          # The fixture is SUPPOSED to exit non-zero. GitHub's pwsh wrapper
          # appends `exit $LASTEXITCODE`, so without this the step inherits the
          # checker's expected failure and reports the gate as broken. Reaching
          # this line means the negative fixture behaved exactly as required.
          exit 0
      - name: Dependency audit
        run: python -m pip_audit
      - name: Secret scan
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\security.ps1
      - name: Build
        run: python -m build
