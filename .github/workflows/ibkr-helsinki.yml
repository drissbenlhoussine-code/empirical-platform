name: IBKR Helsinki isolation

on:
  pull_request:
  push:
    branches: [feature/ibkr-helsinki-paper]

permissions:
  contents: read

jobs:
  official-sdk-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[persistence,test]' -e ./integrations/ibkr
      - name: Download and verify pinned official SDK
        run: |
          curl --fail --location https://interactivebrokers.github.io/downloads/twsapi_macunix.1050.02.zip --output "$RUNNER_TEMP/twsapi.zip"
          python tools/verify_ibkr_sdk_archive.py "$RUNNER_TEMP/twsapi.zip"
          unzip -q "$RUNNER_TEMP/twsapi.zip" -d "$RUNNER_TEMP/ibkr-sdk"
          python -m pip install "$RUNNER_TEMP/ibkr-sdk/IBJts/source/pythonclient"
      - name: Real SDK wire encoding with all sockets forbidden
        run: python -m pytest tests/ibkr_offline/verify_sdk.py --no-cov -q
  postgres-and-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: empirical
          POSTGRES_DB: empirical_ibkr_regression_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U empirical -d empirical_ibkr_regression_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMPIRICAL_PLATFORM_RUN_POSTGRES_TESTS: '1'
      EMPIRICAL_PLATFORM_DATABASE_MODE: TEST
      EMPIRICAL_PLATFORM_POSTGRES_HOST: localhost
      EMPIRICAL_PLATFORM_POSTGRES_PORT: '5432'
      EMPIRICAL_PLATFORM_POSTGRES_DATABASE: empirical_ibkr_regression_test
      EMPIRICAL_PLATFORM_POSTGRES_USER: empirical
      EMPIRICAL_PLATFORM_PAPER_EXIT_POSTGRES_DATABASE: empirical_ibkr_paper_exit_test
      EMPIRICAL_IBKR_TEST_URL: postgresql+psycopg://empirical@localhost:5432/empirical_ibkr_test
      EMPIRICAL_IBKR_RESTORE_TEST_URL: postgresql+psycopg://empirical@localhost:5432/empirical_ibkr_restore_test
      PYTHONPATH: src:integrations/ibkr/src:.
    steps:
      # Historical byte seals were reviewed from Windows materialization.
      # Existing .gitattributes still pins Python and corrected fixtures explicitly.
      - name: Match reviewed fixture checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[persistence,object-storage,dev,test,security,build]'
      - name: Isolated test password
        run: printf 'EMPIRICAL_PLATFORM_POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Test API key
        run: echo "EMPIRICAL_ALPACA_PAPER_API_KEY=$EMPIRICAL_PLATFORM_POSTGRES_USER" >> "$GITHUB_ENV"
      - name: Test API secret
        run: echo "EMPIRICAL_ALPACA_PAPER_SECRET_KEY=$EMPIRICAL_PLATFORM_POSTGRES_USER" >> "$GITHUB_ENV"
      - name: Create isolated stores
        run: |
          createdb -h localhost -U empirical empirical_ibkr_paper_exit_test
          createdb -h localhost -U empirical empirical_ibkr_test
          createdb -h localhost -U empirical empirical_ibkr_restore_test
          psql -h localhost -U empirical -d empirical_ibkr_restore_test -c "COMMENT ON DATABASE empirical_ibkr_restore_test IS 'EMPIRICAL:TEST';"
          psql -h localhost -U empirical -d empirical_ibkr_regression_test -c "COMMENT ON DATABASE empirical_ibkr_regression_test IS 'EMPIRICAL:TEST'; COMMENT ON DATABASE empirical_ibkr_paper_exit_test IS 'EMPIRICAL:TEST'; COMMENT ON DATABASE empirical_ibkr_test IS 'EMPIRICAL:TEST';"
      - name: Full PostgreSQL and Alpaca regression
        run: python -m pytest tests/integration --no-cov -q
      - name: Typed core and optional integration
        run: python -m mypy -p empirical_platform -p empirical_ibkr
      - name: Core and optional SDK architecture
        run: |
          python -m tools.check_architecture
          python -m tools.check_ibkr_architecture
      - name: IBKR contracts, SDK seam and shared manager
        run: python -m pytest tests/unit/test_ibkr_market_access.py tests/unit/test_ibkr_sdk_boundary.py tests/unit/test_ibkr_candidate_and_console.py tests/unit/test_ibkr_review_and_manager.py tests/unit/test_ibkr_setup_probe.py tests/architecture/test_ibkr_boundaries.py tests/unit/test_v1_position_plan_manager.py -o addopts='' --cov=empirical_ibkr --cov-fail-under=80 -q
