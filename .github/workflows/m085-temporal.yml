name: M085 temporal PostgreSQL

on:
  push:
    branches: [feature/m085-alpaca-paper-human-approved-execution]
  pull_request:
    paths:
      - '.github/workflows/m085-temporal.yml'
      - 'src/empirical_platform/**/paper_*.py'
      - 'src/empirical_platform/shared/brokerage/alpaca_paper.py'
      - 'src/empirical_platform/entrypoints/_paper_composition.py'
      - 'migrations/versions/**'
      - 'tools/m085_*.py'
      - 'tests/**/test_m085*.py'

permissions:
  contents: read

jobs:
  temporal-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: empirical
          POSTGRES_DB: empirical_platform
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U empirical -d empirical_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMPIRICAL_PLATFORM_RUN_POSTGRES_TESTS: '1'
      EMPIRICAL_PLATFORM_POSTGRES_HOST: localhost
      EMPIRICAL_PLATFORM_POSTGRES_PORT: '5432'
      EMPIRICAL_PLATFORM_POSTGRES_DATABASE: empirical_platform
      EMPIRICAL_PLATFORM_POSTGRES_USER: empirical
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[persistence,object-storage,test]'
      - name: Set isolated database placeholder
        run: echo "EMPIRICAL_PLATFORM_POSTGRES_PASSWORD=$EMPIRICAL_PLATFORM_POSTGRES_USER" >> "$GITHUB_ENV"
      - name: Real PostgreSQL time boundaries and existing lifecycle/concurrency
        run: >-
          python -m pytest --no-cov -q
          tests/integration/test_m085_temporal_postgres.py
          tests/integration/test_m085_time_basis_postgres.py
          tests/integration/test_m085_paper_execution_postgres.py
          tests/integration/test_m085_concurrency.py
          tests/integration/test_m085_corrective_pass_postgres.py
          tests/integration/test_m084_file_audit.py
      - name: PostgreSQL time-basis mutations (sequential, sources restored)
        run: >-
          python tools/m085_mutation_campaign.py
          --family claim_time_after_lock
          --family database_basis_interval_shape
          --family database_basis_immutable
          --family database_intent_basis_matches_intent
          --family database_intent_basis_bound_to_issuance
          --family database_proposal_basis_matches_proposal
          --family database_decision_basis_matches_approval
          --family database_proposal_basis_bound_to_evaluation
          --family database_decision_basis_bound_to_decision
          --family stale_proposal_refused_at_issuance
          --family database_transition_trigger
          --family database_single_use_trigger
          --family repository_refuses_a_terminal_transition
          --family database_terminal_attempt_immutable
          --family database_broker_identity_written_once
          --family database_authorization_equals_its_preview
          --family database_authorization_inserted_unconsumed
          --family database_authorization_never_outlives_the_intent
          --family database_authorization_within_preview_freshness
          --family database_refused_preview_not_authorizable
          --family database_preview_carries_the_configuration_policy
          --family database_preview_carries_the_intent_order
          --family database_authorizable_preview_within_its_cap
          --output /tmp/m085-pg-mutation.md
