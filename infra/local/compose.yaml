services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: empirical
      POSTGRES_PASSWORD: ${EMPIRICAL_PLATFORM_LOCAL_POSTGRES_PASSWORD:?set EMPIRICAL_PLATFORM_LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: empirical_platform
    ports:
      - "${EMPIRICAL_PLATFORM_LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${EMPIRICAL_PLATFORM_LOCAL_MINIO_ROOT_USER:?set EMPIRICAL_PLATFORM_LOCAL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${EMPIRICAL_PLATFORM_LOCAL_MINIO_ROOT_PASSWORD:?set EMPIRICAL_PLATFORM_LOCAL_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
