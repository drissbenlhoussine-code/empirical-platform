[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-ibkr-paper"
version = "0.1.0"
description = "Optional official TWS API adapter for Empirical Paper market-access ports"
requires-python = ">=3.13"
dependencies = ["empirical-platform"]

[tool.setuptools.packages.find]
where = ["src"]
