[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ANN"]
ignore = [
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["empirical_platform"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
markers = [
  "integration: tests that require local external dependencies",
]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=empirical_platform",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["empirical_platform"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
